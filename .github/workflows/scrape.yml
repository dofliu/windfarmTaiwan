name: scrape-taipower-wind

# 放置位置：.github/workflows/scrape.yml
on:
  schedule:
    # 主要由外部排程服務約每 30 分鐘經 GitHub API 觸發（workflow_dispatch，設定見 DEPLOY.md「外部排程」）；
    # 這個每 2 小時的排程只當備援（GitHub 排程常延遲或略過，2026-10 實測一天只跑 3–6 次）。
    # 刻意錯開整點（全球最壅塞、最常被略過的時段），在偶數小時的第 18 分執行（UTC）。
    - cron: "18 */2 * * *"
  workflow_dispatch: {}       # 外部排程（POST /repos/dofliu/windfarmTaiwan/actions/workflows/scrape.yml/dispatches）與 Actions 頁面手動觸發

permissions:
  contents: write             # 需要寫入權限才能把 json commit 回 repo

concurrency:
  group: scrape-wind
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run scraper
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}   # 中央氣象署風速授權碼(未設定則自動略過風速)
        run: python taipower_wind_scraper.py

      - name: Run international scraper (Australia NEM, Alberta, Ontario; GB, NI, IE, DE, FR, DK, BE, PL, KR, BR, ERCOT, CAISO totals)
        continue-on-error: true     # 國外來源失敗不影響台灣資料的更新
        run: python intl_wind_scraper.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wind_realtime.json wind_history.json
          [ -f data/archive/farm_daily.json ] && git add data/archive/farm_daily.json || true
          [ -f grid_status.json ] && git add grid_status.json || true
          [ -f data/live/intl_realtime.json ] && git add data/live/intl_realtime.json || true
          git diff --staged --quiet || git commit -m "chore: update wind data $(date -u +%FT%TZ)"
          git push
