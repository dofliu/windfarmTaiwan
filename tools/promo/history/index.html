<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History timeline film</title>
  <!-- Google Fonts are injected at boot from FILM.fonts (src/data/film.config.js). -->
  <link rel="stylesheet" href="./public/style.css" />
</head>
<body class="player">
  <main id="player">
    <div id="stage-wrap">
      <div id="canvas-host"></div>
    </div>
    <div id="control-bar">
      <button id="btn-play" type="button">▶</button>
      <span id="time-readout">00:00.0</span>
      <input id="scrubber" type="range" min="0" max="60" step="0.01" value="0" />
      <select id="scene-jump"></select>
      <label class="teach"><input id="teach-mode" type="checkbox" /><span id="teach-label"></span></label>
      <button id="btn-mute" type="button" title="M">🔊</button>
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.9" />
      <span id="audio-status" class="is-loading">…</span>
      <button id="btn-fullscreen" type="button" title="F">⛶</button>
    </div>
    <div id="era-badge"></div>
    <section id="info-card" aria-live="polite"></section>
    <footer><a id="gallery-link" href="./gallery.html">→</a></footer>
  </main>
  <script type="module" src="./src/player.js"></script>
</body>
</html>
